{% extends "!layout.html" %}

{% block htmltitle %}
  {% if seo_page %}
    <title>{{ seo_page.seo_title|e }}</title>
  {% else %}
    {{ super() }}
  {% endif %}
{% endblock %}

{% block extrahead %}
  {% if seo_noindex %}
    <meta name="robots" content="noindex,follow" />
  {% endif %}
  {% if seo_page %}
    <meta name="description" content="{{ seo_page.description|e }}" />
    <link rel="canonical" href="{{ seo_canonical_url|e }}" />
    {% for alternate in seo_hreflangs %}
      <link rel="alternate" hreflang="{{ alternate.language|e }}" href="{{ alternate.url|e }}" />
    {% endfor %}

    <meta property="og:site_name" content="DistilRL" />
    <meta property="og:type" content="{{ seo_page.og_type|e }}" />
    <meta property="og:title" content="{{ seo_page.seo_title|e }}" />
    <meta property="og:description" content="{{ seo_page.description|e }}" />
    <meta property="og:url" content="{{ seo_canonical_url|e }}" />
    <meta property="og:image" content="{{ seo_og_image_url|e }}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DistilRL — a bilingual reinforcement learning guide" />
    <meta property="og:locale" content="{{ 'zh_CN' if seo_page.language == 'zh-CN' else 'en_US' }}" />
    <meta property="og:locale:alternate" content="{{ 'en_US' if seo_page.language == 'zh-CN' else 'zh_CN' }}" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ seo_page.seo_title|e }}" />
    <meta name="twitter:description" content="{{ seo_page.description|e }}" />
    <meta name="twitter:image" content="{{ seo_og_image_url|e }}" />
    <meta name="twitter:image:alt" content="DistilRL — a bilingual reinforcement learning guide" />

    <script type="application/ld+json">{{ seo_jsonld|safe }}</script>
  {% endif %}
{% endblock %}
