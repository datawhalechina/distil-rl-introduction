name: Verify and Deploy Documentation

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.15"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Protect chapter text and original learning images
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python scripts/check_protected_content.py --base "$PR_BASE_SHA"
          elif git rev-parse --verify "$PUSH_BASE_SHA^{commit}" >/dev/null 2>&1; then
            python scripts/check_protected_content.py --base "$PUSH_BASE_SHA"
          else
            python scripts/check_protected_content.py
          fi

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement docs/requirements.txt

      - name: Clean-build documentation with warnings as errors
        run: |
          python -m sphinx -M clean docs docs/_build
          python -m sphinx -W --keep-going -b html docs docs/_build/html
          touch docs/_build/html/.nojekyll

      - name: Verify rendered SEO and internal links
        run: |
          python scripts/check_seo.py \
            --build-dir docs/_build/html \
            --metadata docs/_seo/pages.json

      - name: Upload verified site artifact
        uses: actions/upload-artifact@v4
        with:
          name: distilrl-site-${{ github.sha }}
          path: docs/_build/html
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy verified site
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified site artifact
        uses: actions/download-artifact@v4
        with:
          name: distilrl-site-${{ github.sha }}
          path: site

      - name: Deploy to GitHub Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
